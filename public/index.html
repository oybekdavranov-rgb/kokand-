<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Imora AI — Ishora tilini AI bilan o'rganing</title>
<meta name="description" content="Imora AI — sun'iy intellekt yordamida ishora tilini o'rganish va muloqot qilish. AI chat, 3D avatar va jonli video muloqot bir platformada.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IMORA AI — Home (single screen hero)
   Layers (back → front):
     ocean bg → bubbles → 5 jellyfish → team (human→AI on scroll)
     → brand watermark → 2 transparent shimmer cards → header
   Vanilla JS drives scroll progress (--p) and pointer tilt (--mx/--my)
   ============================================================ */
:root{
  --blue:#2b6fff;
  --royal:#1e5fff;
  --teal:#16e0d0;
  --cyan:#22d3ee;
  --purple:#a855f7;
  --violet:#7b3ff2;
  --ink:#eaf2ff;
  --muted:#9fb4d6;
  --p:0;              /* scroll progress 0..1 */
  --ai:0;             /* human→AI crossfade 0..1 */
  --mx:0;             /* pointer x -1..1 */
  --my:0;             /* pointer y -1..1 */
  --stage-h:100svh;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);
  background:#04070f;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ---------------- HEADER ---------------- */
.header{
  position:fixed;inset:0 0 auto 0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding:18px clamp(18px,4vw,54px);
  transition:background .4s ease, backdrop-filter .4s ease, padding .4s ease;
}
.header.scrolled{
  background:linear-gradient(180deg,rgba(4,8,20,.72),rgba(4,8,20,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:12px;font-family:'Space Grotesk';font-weight:600}
.brand img{width:40px;height:40px;filter:drop-shadow(0 6px 16px rgba(43,111,255,.55))}
.brand b{font-size:20px;letter-spacing:.3px;background:linear-gradient(92deg,#fff,#bcd7ff 60%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11px;letter-spacing:3px;color:var(--muted);display:block;margin-top:-2px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:28px}
.nav a{font-size:14px;color:#c7d6f2;opacity:.85;transition:.25s;position:relative}
.nav a::after{content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:.3s}
.nav a:hover{opacity:1}
.nav a:hover::after{width:100%}
.btn{
  font-family:'Space Grotesk';font-weight:600;font-size:14px;
  padding:11px 22px;border-radius:999px;cursor:pointer;border:0;
  color:#eaf6ff;position:relative;background:transparent;
  transition:transform .25s, box-shadow .25s;
}
.btn--primary{
  background:linear-gradient(100deg,var(--royal),var(--violet) 55%,var(--teal));
  box-shadow:0 10px 30px -8px rgba(43,111,255,.7), inset 0 0 0 1px rgba(255,255,255,.18);
}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px rgba(123,63,242,.8)}
.btn--ghost{border:1px solid rgba(160,190,255,.28)}
.btn--ghost:hover{background:rgba(160,190,255,.08);transform:translateY(-2px)}
.brand span,.btn{white-space:nowrap}
@media(max-width:820px){.nav{display:none}.header .btn--ghost{display:none}}
@media(max-width:520px){.brand span span{display:none}.brand img{width:34px;height:34px}.header{padding:14px 18px}}

/* ---------------- HERO / SCROLL STAGE ---------------- */
.hero{position:relative;height:280vh}     /* long scroll drives the pin */
.stage{
  position:sticky;top:0;height:var(--stage-h);
  overflow:hidden;
  perspective:1400px;
}

/* ---- ocean background ---- */
.ocean{position:absolute;inset:0;z-index:0}
.ocean__base{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 50% -10%, #123a66 0%, #0b2350 26%, #071736 52%, #050d22 74%, #03060f 100%);
}
.ocean__rays{
  position:absolute;inset:-20% -20% auto -20%;height:130%;
  background:
    linear-gradient(180deg, rgba(120,200,255,.16), rgba(120,200,255,0) 62%);
  mix-blend-mode:screen;pointer-events:none;
}
.ocean__rays::before,.ocean__rays::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(78deg,
    rgba(140,215,255,0) 0 40px,
    rgba(140,215,255,.05) 46px,
    rgba(140,215,255,.10) 52px,
    rgba(140,215,255,0) 90px);
  mix-blend-mode:screen;transform-origin:top center;
  animation:sway 14s ease-in-out infinite alternate;
}
.ocean__rays::after{animation-duration:22s;animation-direction:alternate-reverse;opacity:.7}
@keyframes sway{from{transform:skewX(-6deg) translateX(-3%)}to{transform:skewX(7deg) translateX(4%)}}
.ocean__caustics{
  position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.5;
  background:
    radial-gradient(50% 40% at 22% 18%, rgba(80,230,255,.5), transparent 60%),
    radial-gradient(45% 45% at 78% 30%, rgba(140,80,255,.42), transparent 62%),
    radial-gradient(60% 50% at 50% 90%, rgba(20,120,180,.4), transparent 64%);
  animation:caustics 24s ease-in-out infinite alternate;
}
@keyframes caustics{from{transform:translate3d(-2%,-1%,0) scale(1.05)}to{transform:translate3d(3%,2%,0) scale(1.12)}}
.ocean__depth{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 120%,#02040c 0%,rgba(2,4,12,0) 60%);opacity:calc(.25 + var(--p)*.6)}
.ocean__vignette{position:absolute;inset:0;box-shadow:inset 0 0 220px 60px rgba(2,5,14,.9);pointer-events:none}

/* ---- bubbles ---- */
.bubbles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-8vh;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(160,220,255,.25) 45%, rgba(160,220,255,0) 70%);
  box-shadow:0 0 8px rgba(150,220,255,.4);
  animation:rise linear infinite;opacity:0}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.8);opacity:0}
  10%{opacity:.7}
  90%{opacity:.5}
  100%{transform:translateY(-118vh) translateX(var(--drift,20px)) scale(1);opacity:0}
}

/* ---- jellyfish ---- */
.jellies{position:absolute;inset:0;z-index:2;pointer-events:none}
.jelly{position:absolute;will-change:transform;filter:drop-shadow(0 0 22px var(--glow,rgba(140,100,255,.55)));
  animation:drift var(--dur,40s) ease-in-out infinite alternate}
.jelly svg{display:block;overflow:visible;animation:pulse var(--pulse,5s) ease-in-out infinite}
@keyframes drift{
  0%{transform:translate(0,0) rotate(-4deg)}
  100%{transform:translate(var(--dx,40px),var(--dy,-60px)) rotate(5deg)}
}
@keyframes pulse{0%,100%{transform:scale(1,1)}50%{transform:scale(1.09,.9)}}
.tentacle{animation:tent var(--tent,4s) ease-in-out infinite alternate;transform-origin:top center}
@keyframes tent{from{transform:translateY(0) skewX(-3deg)}to{transform:translateY(6px) skewX(4deg)}}

/* ---- team (human → AI) ---- */
.team{
  position:absolute;left:50%;bottom:0;z-index:3;
  width:min(1180px,116vw);
  transform:
    translateX(-50%)
    translateY(calc(2% - var(--p)*4%))
    scale(calc(1 + var(--p)*.22))
    rotateX(calc(var(--my)*-4deg))
    rotateY(calc(var(--mx)*5deg));
  transform-style:preserve-3d;transform-origin:50% 100%;
  will-change:transform;
}
.team__glow{position:absolute;left:50%;bottom:-4%;width:70%;height:34%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(43,111,255,.55),rgba(123,63,242,.25) 45%,transparent 72%);
  filter:blur(30px);z-index:-1}
.team figure{position:relative;animation:float 8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.team img{position:relative;width:100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.team .team__ai{position:absolute;inset:0;opacity:var(--ai);
  filter:drop-shadow(0 0 26px rgba(60,220,255,.55)) drop-shadow(0 40px 60px rgba(0,0,0,.5))}
/* scan line that sweeps during the human→AI morph */
.team__scan{position:absolute;left:0;right:0;height:14%;z-index:4;pointer-events:none;
  top:calc(var(--ai)*88%);opacity:calc(var(--ai)*(1 - var(--ai))*4);
  background:linear-gradient(180deg,transparent,rgba(120,240,255,.85),transparent);
  mix-blend-mode:screen;filter:blur(2px)}

/* ---- brand watermark behind cards ---- */
.watermark{position:absolute;inset:0;z-index:3;display:grid;place-items:start center;padding-top:11vh;
  pointer-events:none;opacity:calc((1 - var(--p)*1.4)*.62)}
.watermark h1{font-family:'Space Grotesk';font-weight:700;letter-spacing:.02em;text-align:center;
  font-size:clamp(52px,13vw,190px);line-height:.9;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(120,170,255,.25));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 80px rgba(43,111,255,.25)}

/* ---------------- TRANSPARENT SHIMMER CARDS ---------------- */
.cards{position:absolute;inset:0;z-index:5;pointer-events:none;
  transform:translateY(calc(var(--p)*-40px));
  opacity:clamp(0,calc((.14 - var(--p))*9 + 1),1)} /* fade a touch as we morph */
.card{
  position:absolute;pointer-events:auto;border-radius:22px;
  background:transparent;                       /* 100% transparent interior */
  padding:clamp(18px,2.1vw,28px);
  transform-style:preserve-3d;
  animation:cardfloat 9s ease-in-out infinite;
}
.card--a{top:15vh;left:clamp(20px,5vw,84px);width:min(348px,40vw)}       /* smaller, upper */
.card--b{bottom:7vh;right:clamp(20px,5vw,84px);width:min(310px,35vw);animation-delay:-4.5s} /* smaller, bottom */
@keyframes cardfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* soft, edgeless shimmering purple↔blue rim (no hard border line) */
.card::before{                       /* masked gradient ring, softened */
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1.6px;
  background:conic-gradient(from var(--spin,0deg),
     var(--purple),var(--blue),var(--cyan),var(--violet),var(--purple));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  filter:blur(1.4px);opacity:.95;
  animation:spin 8s linear infinite;
}
.card::after{                        /* outer aura glow — makes edge edgeless */
  content:'';position:absolute;inset:-2px;border-radius:inherit;z-index:-1;
  background:conic-gradient(from var(--spin,0deg),
     rgba(168,85,247,.8),rgba(43,111,255,.8),rgba(34,211,238,.72),rgba(123,63,242,.8),rgba(168,85,247,.8));
  filter:blur(18px);opacity:.72;
  animation:spin 8s linear infinite;
}
@keyframes spin{to{--spin:360deg}}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
.card__eyebrow{font-family:'Space Grotesk';font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:14px;text-shadow:0 0 18px rgba(34,211,238,.7)}
.card h2{font-family:'Space Grotesk';font-weight:700;line-height:1.06;font-size:clamp(22px,2.4vw,32px);
  margin-bottom:12px;text-shadow:0 2px 26px rgba(0,10,40,.85)}
.card h2 em{font-style:normal;background:linear-gradient(92deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{color:#dbe6ff;font-size:clamp(14px,1.15vw,16px);line-height:1.6;text-shadow:0 2px 18px rgba(0,10,40,.9)}
.card .feats{list-style:none;margin:18px 0 22px;display:grid;gap:12px}
.card .feats li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#e6eeff;text-shadow:0 2px 16px rgba(0,10,40,.9)}
.card .feats i{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:10px;font-style:normal;
  background:linear-gradient(140deg,rgba(43,111,255,.28),rgba(168,85,247,.28));
  box-shadow:inset 0 0 0 1px rgba(180,210,255,.28),0 6px 18px -8px rgba(43,111,255,.7)}
.card .feats b{font-family:'Space Grotesk';display:block;font-size:14px;color:#fff}
.card .feats small{color:var(--muted);font-size:12.5px}
.card .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
@media(max-width:900px){
  .cards{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:13vh 16px 8vh;gap:14px;overflow:auto}
  .card{position:relative;top:auto;left:auto;right:auto;bottom:auto;width:min(460px,92vw)}
}

/* ---- scroll cue ---- */
.cue{position:absolute;left:50%;bottom:26px;z-index:6;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  opacity:clamp(0,calc(1 - var(--p)*6),1);transition:opacity .3s}
.cue .mouse{width:24px;height:38px;border-radius:14px;border:1.5px solid rgba(160,190,255,.5);position:relative}
.cue .mouse::after{content:'';position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;
  background:var(--cyan);transform:translateX(-50%);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;top:7px}30%{opacity:1}100%{opacity:0;top:18px}}

/* ---- section below the hero (placeholder for future "pastki oyna") ---- */
.next{position:relative;z-index:1;min-height:60vh;
  background:linear-gradient(180deg,#03060f 0%,#040a18 100%);
  display:grid;place-items:center;text-align:center;padding:80px 24px;overflow:hidden}
.next::before{content:'';position:absolute;inset:0;
  background:radial-gradient(60% 50% at 50% 0,rgba(43,111,255,.16),transparent 70%)}
.next .inner{position:relative;max-width:640px}
.next h3{font-family:'Space Grotesk';font-size:clamp(24px,4vw,40px);margin-bottom:14px}
.next p{color:var(--muted);line-height:1.7}
.next .dots{margin-top:26px;display:flex;gap:8px;justify-content:center}
.next .dots span{width:8px;height:8px;border-radius:50%;background:rgba(160,190,255,.35);animation:blink 1.6s infinite}
.next .dots span:nth-child(2){animation-delay:.25s}.next .dots span:nth-child(3){animation-delay:.5s}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  .team figure{animation:none}
}
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="header" id="header">
  <a class="brand" href="#">
    <img src="assets/logo.webp" alt="Imora AI logo" onerror="this.src='assets/logo.png'">
    <span style="display:flex;flex-direction:column"><b>Imora AI</b><span>Sign Language · AI</span></span>
  </a>
  <nav class="nav">
    <a href="imkoniyatlar.html">Imkoniyatlar</a>
    <a href="#platforma">Platforma</a>
    <a href="#texnologiya">Texnologiya</a>
    <a href="#jamoa">Jamoa</a>
  </nav>
  <button class="btn btn--primary" type="button">Ilovani ochish</button>
</header>

<!-- ===================== HERO ===================== -->
<section class="hero" id="hero">
  <div class="stage" id="stage">

    <!-- ocean -->
    <div class="ocean" aria-hidden="true">
      <div class="ocean__base"></div>
      <div class="ocean__caustics"></div>
      <div class="ocean__rays"></div>
      <div class="ocean__depth"></div>
      <div class="ocean__vignette"></div>
    </div>

    <!-- bubbles -->
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>

    <!-- jellyfish -->
    <div class="jellies" id="jellies" aria-hidden="true"></div>

    <!-- team: humans → AI -->
    <div class="team" id="team">
      <div class="team__glow"></div>
      <figure>
        <img class="team__human" src="assets/team.webp" alt="Imora AI jamoasi">
        <img class="team__ai" src="assets/team-ai.webp" alt="" aria-hidden="true">
        <div class="team__scan"></div>
      </figure>
    </div>

    <!-- brand watermark -->
    <div class="watermark" aria-hidden="true"><h1>IMORA&nbsp;AI</h1></div>

    <!-- scroll cue -->
    <div class="cue" aria-hidden="true"><div class="mouse"></div><span>Skroll</span></div>
  </div>
</section>

<!-- ===================== NEXT (placeholder) ===================== -->
<section class="next" id="platforma">
  <div class="inner">
    <h3>Pastki bo'lim tez orada</h3>
    <p>Bu — “home” ekranining birinchi bosqichi. Pastki oyna (bo'lim) sizning ko'rsatmangiz bo'yicha keyin qo'shiladi.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</section>

<script>
(function(){
  var root=document.documentElement;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- bubbles ---------- */
  var bWrap=document.getElementById('bubbles');
  var BN=reduce?0:22;
  for(var i=0;i<BN;i++){
    var b=document.createElement('span');b.className='bubble';
    var s=4+Math.random()*16;
    b.style.width=s+'px';b.style.height=s+'px';
    b.style.left=(Math.random()*100)+'%';
    b.style.setProperty('--drift',(Math.random()*80-40)+'px');
    b.style.animationDuration=(9+Math.random()*14)+'s';
    b.style.animationDelay=(-Math.random()*20)+'s';
    bWrap.appendChild(b);
  }

  /* ---------- jellyfish ---------- */
  function jelly(cfg){
    var uid='jg'+Math.random().toString(36).slice(2,8);
    var w=cfg.size, h=cfg.size*1.35;
    var svg=
      '<svg width="'+w+'" height="'+h+'" viewBox="0 0 120 165">'+
      '<defs>'+
        '<radialGradient id="'+uid+'b" cx="50%" cy="38%" r="62%">'+
          '<stop offset="0%" stop-color="'+cfg.c1+'" stop-opacity=".95"/>'+
          '<stop offset="45%" stop-color="'+cfg.c2+'" stop-opacity=".55"/>'+
          '<stop offset="100%" stop-color="'+cfg.c2+'" stop-opacity="0"/>'+
        '</radialGradient>'+
        '<linearGradient id="'+uid+'t" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0%" stop-color="'+cfg.c1+'" stop-opacity=".8"/>'+
          '<stop offset="100%" stop-color="'+cfg.c2+'" stop-opacity="0"/>'+
        '</linearGradient>'+
      '</defs>'+
      '<g class="tentacle" style="--tent:'+(3+Math.random()*3).toFixed(1)+'s">'+
        tent(40,70,uid)+tent(52,66,uid)+tent(64,66,uid)+tent(76,66,uid)+tent(88,70,uid)+
      '</g>'+
      '<path d="M18,64 C18,26 46,8 62,8 C80,8 104,28 104,64 C104,74 96,80 84,74 C74,69 70,74 61,74 C52,74 48,69 38,74 C26,80 18,74 18,64 Z" fill="url(#'+uid+'b)"/>'+
      '<ellipse cx="61" cy="40" rx="30" ry="20" fill="#ffffff" opacity=".14"/>'+
      '<ellipse cx="52" cy="32" rx="8" ry="5" fill="#ffffff" opacity=".35"/>'+
      '</svg>';
    var el=document.createElement('div');
    el.className='jelly';
    el.style.left=cfg.x;el.style.top=cfg.y;
    el.style.setProperty('--glow',cfg.glow);
    el.style.setProperty('--dur',cfg.dur+'s');
    el.style.setProperty('--dx',cfg.dx+'px');
    el.style.setProperty('--dy',cfg.dy+'px');
    el.style.setProperty('--pulse',cfg.pulse+'s');
    el.style.animationDelay=(-Math.random()*cfg.dur)+'s';
    el.dataset.depth=cfg.depth;
    el.innerHTML=svg;
    return el;
  }
  function tent(x,len,uid){
    var sway=(Math.random()*10-5).toFixed(1);
    return '<path d="M'+x+',66 q'+sway+','+(len*0.45)+' 0,'+len+'" stroke="url(#'+uid+'t)" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
  }
  var jWrap=document.getElementById('jellies');
  var defs=[
    {size:150,x:'8%', y:'20%',c1:'#8be9ff',c2:'#7b3ff2',glow:'rgba(123,63,242,.6)', dur:38,dx:60, dy:-50,pulse:5, depth:.9},
    {size:110,x:'70%',y:'14%',c1:'#b39cff',c2:'#2b6fff',glow:'rgba(43,111,255,.55)',dur:46,dx:-70,dy:-40,pulse:6, depth:.7},
    {size:190,x:'52%',y:'46%',c1:'#7fe9ff',c2:'#a855f7',glow:'rgba(168,85,247,.6)', dur:52,dx:40, dy:-70,pulse:7, depth:1.2},
    {size:90, x:'24%',y:'58%',c1:'#c6b4ff',c2:'#16e0d0',glow:'rgba(22,224,208,.45)',dur:42,dx:80, dy:-55,pulse:5.5,depth:.55},
    {size:130,x:'85%',y:'52%',c1:'#9ad6ff',c2:'#7b3ff2',glow:'rgba(123,63,242,.5)', dur:48,dx:-55,dy:-65,pulse:6.5,depth:1}
  ];
  var jset=[];
  defs.forEach(function(d){var el=jelly(d);jWrap.appendChild(el);jset.push(el);});

  /* ---------- scroll progress ---------- */
  var hero=document.getElementById('hero');
  var header=document.getElementById('header');
  function smooth(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
  var targetP=0,curP=0;
  function measure(){
    var r=hero.getBoundingClientRect();
    var total=hero.offsetHeight-window.innerHeight;
    targetP=Math.min(1,Math.max(0,(-r.top)/(total||1)));
  }
  function frame(){
    curP+=(targetP-curP)*0.12;
    root.style.setProperty('--p',curP.toFixed(4));
    root.style.setProperty('--ai',smooth(0.24,0.72,curP).toFixed(4));
    // jellyfish parallax rise with depth
    for(var i=0;i<jset.length;i++){
      var d=parseFloat(jset[i].dataset.depth);
      jset[i].style.marginTop=(-curP*120*d)+'px';
    }
    header.classList.toggle('scrolled',window.scrollY>40);
    requestAnimationFrame(frame);
  }
  window.addEventListener('scroll',measure,{passive:true});
  window.addEventListener('resize',measure);
  measure();requestAnimationFrame(frame);

  /* ---------- pointer tilt (3D) ---------- */
  if(!reduce){
    var tx=0,ty=0,cx=0,cy=0;
    window.addEventListener('pointermove',function(e){
      tx=(e.clientX/window.innerWidth-0.5)*2;
      ty=(e.clientY/window.innerHeight-0.5)*2;
    },{passive:true});
    (function tilt(){
      cx+=(tx-cx)*0.06;cy+=(ty-cy)*0.06;
      root.style.setProperty('--mx',cx.toFixed(3));
      root.style.setProperty('--my',cy.toFixed(3));
      requestAnimationFrame(tilt);
    })();
  }
})();
</script>
</body>
</html>

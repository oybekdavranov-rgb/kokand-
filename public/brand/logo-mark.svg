<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Imora AI belgisi">
  <!--
    IMORA AI — logo-mark (VAQTINCHALIK PLACEHOLDER).
    Foydalanuvchi yuborgan yurak+qo'llar dizayni asosida qayta chizilgan
    SVG. Haqiqiy vektor asset kelganda shu fayl almashtiriladi.
    (CLAUDE.md §2 — ASSET MANIFEST)
  -->
  <defs>
    <linearGradient id="imoraHeart" x1="18" y1="40" x2="238" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e5bff"/>
      <stop offset="0.5" stop-color="#1aa0e6"/>
      <stop offset="1" stop-color="#22e3c7"/>
    </linearGradient>
    <linearGradient id="imoraWell" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123a9e"/>
      <stop offset="1" stop-color="#0f7fae"/>
    </linearGradient>
    <radialGradient id="imoraSheen" cx="0.32" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tashqi yurak (yorug' gradient qirra) -->
  <path fill="url(#imoraHeart)" d="M128 226C56 176 20 135 20 92 20 59 44 37 74 37 100 37 118 54 128 75 138 54 156 37 182 37 212 37 236 59 236 92 236 135 200 176 128 226Z"/>
  <!-- Ichki chuqurlik (quyuqroq yurak) -->
  <path fill="url(#imoraWell)" d="M128 202C70 162 42 129 42 95 42 71 59 56 80 56 101 56 117 70 128 90 139 70 155 56 176 56 197 56 214 71 214 95 214 129 186 162 128 202Z"/>

  <!-- Ikki qo'l (oq) — bir-biriga intilib -->
  <g fill="#f3f7ff">
    <!-- Pastki-chapdan kelayotgan qo'l -->
    <g transform="translate(96 150) rotate(-15) scale(0.6)">
      <rect x="-64" y="21" width="70" height="28" rx="14"/>
      <rect x="-6" y="8" width="50" height="56" rx="19"/>
      <rect x="38" y="11" width="47" height="12" rx="6"/>
      <rect x="38" y="24" width="52" height="12" rx="6"/>
      <rect x="38" y="37" width="48" height="12" rx="6"/>
      <rect x="38" y="50" width="40" height="12" rx="6"/>
      <rect x="0" y="-8" width="17" height="36" rx="8" transform="rotate(-30 8 18)"/>
    </g>
    <!-- Yuqori-o'ngdan kelayotgan qo'l (oyna aksi) -->
    <g transform="translate(160 106) rotate(9) scale(-0.6 0.6)">
      <rect x="-64" y="21" width="70" height="28" rx="14"/>
      <rect x="-6" y="8" width="50" height="56" rx="19"/>
      <rect x="38" y="11" width="47" height="12" rx="6"/>
      <rect x="38" y="24" width="52" height="12" rx="6"/>
      <rect x="38" y="37" width="48" height="12" rx="6"/>
      <rect x="38" y="50" width="40" height="12" rx="6"/>
      <rect x="0" y="-8" width="17" height="36" rx="8" transform="rotate(-30 8 18)"/>
    </g>
  </g>

  <!-- Yuqori chap yaltiroq -->
  <path fill="url(#imoraSheen)" d="M128 226C56 176 20 135 20 92 20 59 44 37 74 37 100 37 118 54 128 75 138 54 156 37 182 37 212 37 236 59 236 92 236 135 200 176 128 226Z"/>
</svg>

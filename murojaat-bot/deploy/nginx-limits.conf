# =====================================================================
#  "http" blokiga qo'shiladigan sozlamalar
#  Joylash:  sudo cp deploy/nginx-limits.conf /etc/nginx/conf.d/murojaat-limits.conf
# =====================================================================

# Admin panelga so'rovlar chegarasi (nginx.conf dagi limit_req shuni ishlatadi)
limit_req_zone $binary_remote_addr zone=murojaat_panel:10m rate=10r/s;

# Ixtiyoriy: panelni faqat universitet tarmog'iga ochish.
# Yoqish uchun nginx.conf dagi "if ($murojaat_allowed = 0)" qatorini oching.
# geo $murojaat_allowed {
#     default 0;
#     84.54.0.0/16  1;      # universitet tarmog'i
#     127.0.0.1/32  1;
# }

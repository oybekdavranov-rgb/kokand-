# =====================================================================
#  Nginx — FAQAT webhook rejimi uchun kerak (BOT_MODE=webhook).
#  polling rejimida (tavsiya etilgan) nginx umuman kerak emas —
#  bot Telegram'ga o'zi ulanadi, tashqaridan port ochish shart emas.
#
#  O'rnatish:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/murojaat
#    sudo ln -s /etc/nginx/sites-available/murojaat /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d murojaat.example.uz
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name murojaat.example.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name murojaat.example.uz;

    ssl_certificate     /etc/letsencrypt/live/murojaat.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaat.example.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 2m;

    # Telegram webhook (yo'l maxfiy + maxfiy sarlavha bilan himoyalangan)
    location /tg/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Holat tekshiruvi (monitoring uchun)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Boshqa hamma narsa yopiq — bu botda web-panel yo'q
    location / { return 404; }
}

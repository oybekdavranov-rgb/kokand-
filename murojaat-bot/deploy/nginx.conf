# =====================================================================
#  Nginx — HTTPS tugatish va panelni tashqariga chiqarish
#
#  O'rnatish:
#    sudo cp deploy/nginx-limits.conf /etc/nginx/conf.d/murojaat-limits.conf
#    sudo cp deploy/nginx.conf        /etc/nginx/sites-available/murojaat
#    sudo ln -s /etc/nginx/sites-available/murojaat /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d murojaat.example.uz
#
#  Eslatma: so'rov chegarasi (limit_req_zone) "http" blokida e'lon qilinishi
#  shart — shuning uchun u alohida nginx-limits.conf faylida beriladi.
# =====================================================================

# Panelni faqat kerakli IP'larga ochish (ixtiyoriy, lekin tavsiya etiladi).
# geo blokini ham nginx-limits.conf ichiga qo'ying va bu yerda ishlating.

server {
    listen 80;
    listen [::]:80;
    server_name murojaat.example.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    # "listen ... http2" — nginx 1.9.5 dan 1.27 gacha hamma versiyada ishlaydi.
    # (Alohida "http2 on;" direktivasi faqat 1.25.1+ da bor, shuning uchun
    #  Ubuntu 24.04 / Debian 12 dagi nginx uni tushunmaydi.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name murojaat.example.uz;

    ssl_certificate     /etc/letsencrypt/live/murojaat.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaat.example.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 2m;

    # Telegram webhook — hamma uchun ochiq bo'lishi kerak
    # (yo'lning o'zi maxfiy + maxfiy sarlavha bilan himoyalangan)
    location /tg/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Admin panel
    location / {
        # Faqat ruxsat etilgan tarmoqlar uchun ochish
        # (nginx-limits.conf dagi geo bloki bilan):
        # if ($murojaat_allowed = 0) { return 403; }

        limit_req zone=murojaat_panel burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# =====================================================================
#  Nginx — HTTPS tugatish va panelni tashqariga chiqarish
#  Joylash: /etc/nginx/sites-available/murojaat  → sites-enabled'ga link
#  Sertifikat:  sudo certbot --nginx -d murojaat.example.uz
# =====================================================================

# Murojaat panelini faqat kerakli IP'larga ochish (ixtiyoriy, lekin tavsiya etiladi).
# geo $admin_allowed {
#     default 0;
#     84.54.0.0/16 1;          # universitet tarmog'i
# }

server {
    listen 80;
    listen [::]:80;
    server_name murojaat.example.uz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name murojaat.example.uz;

    ssl_certificate     /etc/letsencrypt/live/murojaat.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaat.example.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 2m;

    # Telegram webhook — hamma uchun ochiq bo'lishi kerak (yo'l maxfiy + maxfiy sarlavha bilan himoyalangan)
    location /tg/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Admin panel
    location / {
        # Faqat ruxsat etilgan tarmoqlar uchun ochish (yuqoridagi geo bloki bilan):
        # if ($admin_allowed = 0) { return 403; }

        limit_req zone=murojaat_panel burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# http { ... } blokiga qo'shiladi:
# limit_req_zone $binary_remote_addr zone=murojaat_panel:10m rate=10r/s;
